    <title>Cuadrado en Crecimiento</title>
    <style>
        body{
            margin: 0;

            display: grid;
            place-items: center;
            width: 100vw;
            height: 100vh;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
            background-color: #E5D9F2;
            color: white;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            grid-column-gap: 0px;
            grid-row-gap: 0px;
            }

        }

            font-size: 3rem;
            text-decoration: none;
            color: #A594F9;
        }
        .div1 {
            grid-area: 1 / 1 / 2 / 2;
        }
        .div2 {
            grid-area: 1 / 5 / 2 / 6;

        }
